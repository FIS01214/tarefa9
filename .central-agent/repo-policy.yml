version: 1
repository_profile:
  role: dev
  allowed_roles:
    - dev
    - official
  dev:
    intent: Active development repository.
    direct_development: true
    require_issue_pr_workflow: true
    validation: local
    codex_review: when_requested
    release_channel: release-candidate
    require_changelog_for_release: false
    require_release_assets: false
  official:
    intent: Stable official repository.
    direct_development: limited
    require_issue_pr_workflow: true
    validation: local
    codex_review: when_requested
    release_channel: stable
    require_complete_documentation: true
    require_changelog_for_release: true
    require_release_assets: true
    require_semantic_versioning: true
issue_policy:
  require_issue_for_non_trivial_changes: true
  normalize_short_descriptions: true
  required_sections:
    - Goal
    - Scope
    - Acceptance Criteria
labels:
  apply_when_present:
    - type:feature
    - type:bug
    - type:docs
    - area:governance
    - area:workflow
    - priority:high
  definitions:
    - name: type:feature
      color: a2eeef
      description: Feature work or new behavior
    - name: type:bug
      color: d73a4a
      description: Bug fix or regression repair
    - name: type:docs
      color: 0075ca
      description: Documentation-only or documentation-heavy work
    - name: area:governance
      color: 5319e7
      description: Agent, issue, PR, review, or repository governance
    - name: area:workflow
      color: 1d76db
      description: Local automation, validation, or workflow behavior
    - name: priority:high
      color: b60205
      description: High-priority work
milestones:
  require_for_major_work: false
assignees:
  required: []
projects:
  require_for_major_work: false
  required: []
pull_request_policy:
  require_issue_link: true
  require_validation_summary: true
  require_documentation_review: true
  request_codex_review: false
  pr_body_sections:
    - Summary
    - Issue Link
    - Validation
    - Documentation
    - Follow-up Work
verification:
  command: bash scripts/ci-central-agent-verify.sh
  required: true
  allow_missing_hook: false
  github_actions_allowed: false
  report_validation_in_pr_comment: true
documentation:
  command: bash scripts/check_docs.sh
  required_for_user_visible_changes: true
codex_review:
  max_repair_attempts: 3
  reviewer_login: chatgpt-codex-connector
merge:
  allow_auto_merge_when_requested: true
  require_required_checks: false
  require_clear_codex_review_threads: true
repo_metadata:
  manage_about_metadata: true
  allow_visibility_changes: false
  allow_archive_changes: false
branch_ruleset:
  manage_main_ruleset: false
  required_status_check: ""
